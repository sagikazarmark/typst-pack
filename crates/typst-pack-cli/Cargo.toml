[package]
name = "typst-pack-cli"
version.workspace = true
description = "Command-line interface for creating and compiling portable Typst project packs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["typst", "documents", "packaging", "archive", "fonts"]
categories = ["command-line-utilities", "text-processing", "filesystem"]

[features]
_test-package-download-probe = ["typst-pack/_test-package-download-probe"]

[[bin]]
name = "typst-pack"
path = "src/main.rs"
doc = false

[dependencies]
typst-pack = { workspace = true, features = ["diagnostics", "embedded-fonts", "fs", "parallel"] }

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
open = "5"
rayon = { workspace = true }
serde_json = "1"
sigpipe = "0.1"
typst = { workspace = true }
typst-kit = { workspace = true, features = ["emit-diagnostics", "embedded-fonts", "scan-fonts", "system-files", "timer"] }
typst-pdf = { workspace = true }

[dev-dependencies]
hayro-syntax = { workspace = true }
tempfile = { workspace = true }
