name: Native filesystem lifecycle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --locked -p typst-pack --no-default-features --features opendal --target ${{ matrix.target }}
      - run: cargo check --locked -p typst-pack --no-default-features --features opendal,package-reading --target ${{ matrix.target }}
      - run: cargo test --locked -p typst-pack --no-default-features --features opendal --target ${{ matrix.target }} --lib opendal::read::tests
      - run: cargo test --locked -p typst-pack --no-default-features --features opendal --target ${{ matrix.target }} --lib opendal::pack_assembly::package::tests
      - run: cargo test --locked -p typst-pack --no-default-features --features opendal --target ${{ matrix.target }} --lib opendal::write::tests
      - run: cargo test --locked -p typst-pack --no-default-features --features opendal --target ${{ matrix.target }} --test opendal_location --test opendal_bindings --test opendal_font_reading --test opendal_package_reading --test opendal_pack_archive_writing --test opendal_package_cache_archive_writing --test opendal_compilation_artifact_writing --test opendal_pack_extraction_writing
      - run: cargo test --locked -p typst-pack --no-default-features --features opendal,package-reading --target ${{ matrix.target }} --test opendal_package_reading --test opendal_package_cache_archive_writing
      - run: cargo test --locked -p typst-pack --no-default-features --features fs,opendal,package-reading,embedded-fonts --target ${{ matrix.target }} --test creation_conformance
      - run: cargo test --locked -p typst-pack --features fs,embedded-fonts --lib filesystem_write::tests
      - run: cargo test --locked -p typst-pack --features fs,embedded-fonts --test filesystem_project_reading --test filesystem_font_catalog_reading --test filesystem_package_reading --test filesystem_pack_assembly --test fs_creation --test pack_archive_reading --test pack_archive_writing --test filesystem_writing
