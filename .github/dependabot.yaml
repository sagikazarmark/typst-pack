version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      typst:
        patterns:
          - "typst*"
      all:
        patterns:
          - "*"
        exclude-patterns:
          - "typst*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      all:
        patterns:
          - "*"
    exclude-paths:
      - .github/workflows/release.yml
      - .github/workflows/dagger.yaml
