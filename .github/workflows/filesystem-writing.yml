name: Native filesystem lifecycle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      # Compile coverage only: the OpenDAL adapter has no platform-specific
      # code, so its behavior is exercised once on Linux by the `opendal` job.
      - if: ${{ !cancelled() }}
        run: cargo check --locked -p typst-pack --no-default-features --features opendal --target ${{ matrix.target }}
      - if: ${{ !cancelled() }}
        run: cargo check --locked -p typst-pack --no-default-features --features opendal,package-reading --target ${{ matrix.target }}
      # The filesystem adapter is where platform behavior lives: symlink and
      # alias refusal, entry kinds, staging, and commit all differ per target.
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p typst-pack --no-default-features --features fs,opendal,package-reading,embedded-fonts --target ${{ matrix.target }} --test creation_conformance
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p typst-pack --features fs,embedded-fonts --lib fs::
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p typst-pack --features fs,embedded-fonts --test fs --test pack

  opendal:
    name: opendal (feature-isolated)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
      # The Dagger `test` check runs these with every feature enabled. Running
      # them again with only `opendal` active keeps the feature gates honest.
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p typst-pack --no-default-features --features opendal --lib opendal::tests
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p typst-pack --no-default-features --features opendal --test opendal_adapter
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p typst-pack --no-default-features --features opendal,package-reading --test opendal_adapter
