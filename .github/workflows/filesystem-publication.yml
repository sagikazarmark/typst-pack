name: Filesystem publication

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-14]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo test --locked -p typst-pack --features fs --lib filesystem_plan_publication::tests
      - run: cargo test --locked -p typst-pack --features fs --test filesystem_plan_publication
