[package]
name = "typst-pack"
version.workspace = true
description = "Portable single-file packs of Typst projects: sources, resources, packages, and fonts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["typst", "documents", "packaging", "archive", "fonts"]
categories = ["command-line-utilities", "text-processing", "filesystem"]

[features]
default = []
# Internal opt-in for controlled package downloader integration tests. It
# replaces the downloader egress uses, so it implies the capability it probes.
_test-package-download-probe = ["egress"]
# Retain the source context needed by diagnostic presentation adapters.
diagnostics = ["typst-kit/emit-diagnostics"]
# Ship Typst's embedded fonts (Libertinus Serif, New Computer Modern, ...) so
# packs that only use them render without any font embedding.
embedded-fonts = ["typst-kit/embedded-fonts"]
# Transport-free package acquisition helpers: registry URL construction and
# bounded package archive expansion. Pulls compression and archive support but
# no HTTP client, so a host supplies its own transport.
package-acquisition = ["dep:flate2", "dep:tar"]
# Export independent pages in parallel.
parallel = ["dep:rayon"]
# Filesystem-based packing: structural snapshot acquisition, local package
# directories and cache, system font scanning. Links no transport, so a build
# with this feature alone cannot download under any runtime configuration. Not
# available on wasm targets.
fs = [
    "dep:fontconfig-parser",
    "dep:ignore",
    "dep:libc",
    "dep:walkdir",
    "dep:windows-sys",
    "typst-kit/system-files",
    "typst-kit/timer",
]
# Network egress: downloading packages from the Typst Universe registry during
# filesystem creation, with the custom certificate and package cache directory
# that only a download needs. This is what links an HTTP client and TLS roots
# into the build, so the absence of egress is verifiable from the dependency
# graph.
egress = [
    "dep:env_proxy",
    "dep:rustls-pemfile",
    "dep:ureq",
    "dep:webpki-roots",
    "fs",
    "package-acquisition",
]

[dependencies]
ecow = "0.2"
env_proxy = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
ignore = { version = "0.4", optional = true }
rayon = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
rustls-pemfile = { version = "2", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
# Typst crates share internal types and must resolve to the same exact release.
typst = { workspace = true }
typst-html = "=0.15.1"
typst-kit = { workspace = true }
typst-layout = "=0.15.1"
typst-pdf = { workspace = true }
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
typst-timing = "=0.15.1"
walkdir = { version = "2", optional = true }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
webpki-roots = { version = "1", optional = true }
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
fontconfig-parser = { version = "0.5", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"], optional = true }

[dev-dependencies]
# The acquisition suite writes the archives the helpers expand.
flate2 = "1"
hayro-syntax = { workspace = true }
ignore = "0.4"
proptest = "1"
tar = { version = "0.4", default-features = false }
tempfile = { workspace = true }
tiny-skia = "0.12"

[build-dependencies]
toml = "1.1"
