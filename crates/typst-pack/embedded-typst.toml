# The embedded Typst release. Every `typst` and `typst-*` crate is pinned to
# this exact version; `build.rs` reports it through `typst_pack::VERSION`, and
# `tests/embedded_typst_gate.rs` checks the manifests and `Cargo.lock` against
# it. See docs/embedded-typst-upgrade.md.
[typst]
version = "0.15.1"

# The official Typst CLI used as the differential oracle, installed by
# scripts/install-official-typst.sh (Dagger and the release workflow).
[official-cli]
version = "0.15.1"
platform = "x86_64-unknown-linux-musl"
url = "https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz"
sha256 = "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
