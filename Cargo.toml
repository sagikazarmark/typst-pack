[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/typst-pack"
homepage = "https://github.com/sagikazarmark/typst-pack"

[workspace.dependencies]
typst-pack = { path = "crates/typst-pack", version = "0.4.0" }

hayro-syntax = "0.7"
rayon = "1"
tempfile = "3"
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["datetime"] }
typst-pdf = "=0.15.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
dependent-version = "upgrade"
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
