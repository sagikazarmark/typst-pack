[package]
name = "typst-pack-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.92"

[package.metadata]
cargo-fuzz = true

[dependencies]
flate2 = "1"
libfuzzer-sys = "0.4"
tar = { version = "0.4", default-features = false }
tempfile = "3"
typst = "=0.15.1"
typst-pack = { path = "../crates/typst-pack", features = ["fs", "package-acquisition"] }

[[bin]]
name = "project_snapshot_assembly"
path = "fuzz_targets/project_snapshot_assembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_container"
path = "fuzz_targets/font_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pack_archive_decoder"
path = "fuzz_targets/pack_archive_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "package_archive_expansion"
path = "fuzz_targets/package_archive_expansion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filesystem_project_gathering"
path = "fuzz_targets/filesystem_project_gathering.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compilation_request"
path = "fuzz_targets/compilation_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filesystem_plan_publication"
path = "fuzz_targets/filesystem_plan_publication.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
