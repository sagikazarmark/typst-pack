[package]
name = "typst-pack-cli"
version = "0.4.0"
description = "Command-line interface for creating and compiling portable Typst project packs"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/typst-pack"
homepage = "https://github.com/sagikazarmark/typst-pack"
readme = "README.md"
keywords = ["typst", "documents", "packaging", "archive", "fonts"]
categories = ["command-line-utilities", "text-processing", "filesystem"]

[features]
_test-package-download-probe = ["typst-pack/_test-package-download-probe"]

[[bin]]
name = "typst-pack"
path = "src/main.rs"
doc = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
open = "5"
rayon = "1"
serde_json = "1"
sigpipe = "0.1"
typst = "=0.15.0"
typst-kit = { version = "=0.15.0", default-features = false, features = ["datetime", "emit-diagnostics", "embedded-fonts", "scan-fonts", "system-files", "timer"] }
typst-pack = { version = "=0.4.0", path = "..", features = ["diagnostics", "embedded-fonts", "fs", "parallel"] }
typst-pdf = "=0.15.0"

[dev-dependencies]
hayro-syntax = "0.7"
tempfile = "3"
