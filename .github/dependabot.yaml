version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      cargo-typst:
        patterns:
          - "typst*"
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          - "typst*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
    exclude-paths:
      - .github/workflows/release.yml
      - .github/workflows/dagger.yaml
